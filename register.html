<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - FTU IT Lab</title>
    <link rel="stylesheet" href="login-style.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <h2>Sign Up</h2>
            <form onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label for="reg-username">Username</label>
                    <input type="text" id="reg-username" placeholder="Set username" required>
                </div>
                <div class="input-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" placeholder="Set password" required>
                </div>
                <button type="submit" class="btn-signin">Confirm Registration</button>
            </form>
            <a href="login.html" style="display:block; text-align:center; margin-top:15px; color:#aaa; text-decoration:none; font-size:14px;">← Back to Login</a>
        </div>
    </div>
    <script src="login-script.js"></script>
    <script>
        
        document.body.classList.add("active");
    </script>
</body>
</html>
